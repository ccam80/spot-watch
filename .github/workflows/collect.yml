name: Collect spot placement scores

on:
  schedule:
    - cron: "7 * * * *"   # hourly, off the top-of-hour rush
  workflow_dispatch:

permissions:
  id-token: write   # OIDC -> AWS
  contents: write   # commit data and report

# One collector at a time so the data commits never race.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE: ${{ secrets.AWS_SPOT_WATCH_ROLE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the AWS role secret
        if: env.AWS_ROLE == ''
        run: |
          echo "::error::AWS_SPOT_WATCH_ROLE is not set; see README"
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: us-east-2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet boto3==1.43.81

      - name: Sample scores and prices
        run: python collect.py

      - name: Render the report
        run: python report.py

      - name: Keep raw responses for a week
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: raw
          retention-days: 7

      - name: Commit the sample
        run: |
          git config user.name "spot-watch bot"
          git config user.email "spot-watch@users.noreply.github.com"
          git add data REPORT.md report
          git diff --cached --quiet && exit 0
          git commit -q -m "data: sample $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
